# Lock screen. Reference: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
# Info lines come from lock-battery, lock-next-event, lock-weather and lock-now-playing
# (home-manager/modules/programs/hyprland-session.nix).
# Clear the password buffer with ESC, Ctrl+U or Ctrl+Backspace.

$font = Fira Code
$fg = rgba(220, 225, 222, 0.92)
$muted = rgba(183, 188, 186, 0.75)
$wallpaper = ~/Pictures/autumn_forest.png

general {
    hide_cursor = false
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint or type password
        present_message = Scanning…
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    brightness = 0.7
}

# TIME
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 90
    font_family = $font
    position = 0, -25
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = $muted
    font_size = 22
    font_family = $font
    position = 0, -115
    halign = center
    valign = center
}

# NEXT EVENT (within a week)
label {
    monitor =
    text = cmd[update:60000] lock-next-event
    color = $muted
    font_size = 15
    font_family = $font
    position = 0, -165
    halign = center
    valign = center
}

# WEATHER (cached for 30 min by lock-weather)
label {
    monitor =
    text = cmd[update:600000] lock-weather
    color = $muted
    font_size = 14
    font_family = $font
    position = -30, -25
    halign = right
    valign = top
}

# BATTERY
label {
    monitor =
    text = cmd[update:30000] lock-battery
    color = $muted
    font_size = 14
    font_family = $font
    position = -30, -55
    halign = right
    valign = top
}

# NOW PLAYING
label {
    monitor =
    text = cmd[update:5000] lock-now-playing
    color = $muted
    font_size = 14
    font_family = $font
    position = 30, -25
    halign = left
    valign = top
}

# PROFILE PICTURE (~/.face.png links to the GNOME account picture)
image {
    monitor =
    path = ~/.face.png
    size = 110
    rounding = -1
    border_size = 0
    position = 0, 125 # above the clock
    halign = center
    valign = center
}

# No outline or fill: with outline_thickness = 0 the state colours tint the
# field itself, so checking / wrong password / Caps Lock show as a soft tint.
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 0
    rounding = -1
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgba(0, 0, 0, 0.0)
    check_color = rgba(104, 181, 171, 0.25)
    fail_color = rgba(209, 67, 76, 0.35)
    capslock_color = rgba(229, 192, 123, 0.3)
    font_color = $fg
    font_family = $font

    # Stay visible so the fingerprint prompt shows while the field is empty.
    fade_on_empty = false
    placeholder_text = <span foreground="##b7bcbabf">$FPRINTPROMPT</span>
    fail_text = $FAIL <b>($ATTEMPTS)</b>
    dots_spacing = 0.3

    position = 0, 60
    halign = center
    valign = bottom
}
