general {
    lock_cmd = pidof hyprlock || hyprlock                                 # avoid stacking lock screens
    before_sleep_cmd = loginctl lock-session                              # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'   # wake displays after resume
}

listener {
    timeout = 120                           # 5min
    on-timeout = loginctl lock-session      # command to run when timeout has passed
}

listener {
    timeout = 130                           # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'  # command to run when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'    # command to run when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                          # 30min
    on-timeout = idle-suspend               # suspends only on battery
}
