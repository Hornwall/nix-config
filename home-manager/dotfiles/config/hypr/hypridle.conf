general {
    lock_cmd = pidof hyprlock || hyprlock                                 # avoid stacking lock screens
    before_sleep_cmd = loginctl lock-session                              # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'   # wake displays after resume
}

# on-battery (home-manager/modules/programs/hyprland-session.nix) exits 0 only
# when running on battery, so these listeners lock early on battery, later on AC.

# Screens off once locked, whatever the power source: "pidof hyprlock" makes
# these no-ops while unlocked. 30 s covers a manual lock (SUPER+Escape), 130 s
# covers the battery idle lock below.
listener {
    timeout = 30
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# On battery: lock after 2 min, screen off 10 s later.
listener {
    timeout = 120
    on-timeout = on-battery && loginctl lock-session
}

listener {
    timeout = 130
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Any power source: lock after 10 min, screen off 10 s later.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 610
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# On battery: suspend after 30 min.
listener {
    timeout = 1800
    on-timeout = on-battery && systemctl suspend
}
